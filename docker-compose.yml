services:
  app:
    build: .
    image: astra-trading-app:latest
    container_name: astra-trading-app
    restart: unless-stopped
    # Explicit deployment settings override a legacy four-ticker .env.
    environment:
      T_INVEST_INSTRUMENTS: ""
      T_INVEST_MAX_INSTRUMENTS: "300"
    ports:
      - "8765:8765"
    volumes:
      # Survives container recreation on every deploy; holds the live-arm audit trail.
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
