name: Deploy to server

on:
  workflow_run:
    workflows: [Verify terminal]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: self-hosted
    concurrency:
      group: astra-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build and start new stack
        run: |
          docker compose up -d --build

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/api/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'; then
              echo "Service is up"
              exit 0
            fi
            sleep 2
          done
          echo "Service did not become healthy in time"
          docker logs astra-trading-app --tail 100 || true
          exit 1
